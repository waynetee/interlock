<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="three fingerprint strips, out of register">
  <!--
    The mechanism, at 16 pixels: three strips of the fingerprint register, out
    of register. Lime, cyan and violet are the same three the bench uses, and
    each strip is a cell mosaic rather than a solid bar - the texture IS the
    fingerprint, and the stagger is the thing the whole demo is about: they do
    not line up until something puts them in register. Ends are anchored and
    the punch is deterministic, so the icon is stable across regenerations.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0f14"/>
  <rect x="6.00" y="5.00" width="2.20" height="2.20" fill="#b6e04c"/>
  <rect x="11.50" y="5.00" width="2.20" height="2.20" fill="#b6e04c"/>
  <rect x="17.00" y="5.00" width="2.20" height="2.20" fill="#b6e04c"/>
