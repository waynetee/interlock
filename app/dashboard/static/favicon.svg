<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="three strips registering">
  <!--
    The mechanism, at 16 pixels: three strips of a picture, out of register.
    Lime, cyan and violet are the same three the bench uses for A, B and C, and the
    stagger is the thing the whole demo is about - they do not line up until
    something puts them in register.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0f14"/>
  <rect x="6"  y="6"  width="22" height="6" rx="1.5" fill="#b6e04c"/>
  <rect x="3"  y="13" width="22" height="6" rx="1.5" fill="#3fd2ea"/>
  <rect x="8"  y="20" width="22" height="6" rx="1.5" fill="#c98cf6"/>
</svg>
