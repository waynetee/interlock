<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Certifier</title>
<style>
:root{
  --ink:#0D1420; --paper:#F4F6FA; --paper-2:#FFFFFF; --line:#D9DFE9;
  --signal:#3D5AFE; --signal-soft:#E8ECFF;
  --pass:#1F7A52; --hold:#B07A0B; --fail:#B3322A;
  --bg:var(--paper); --surface:var(--paper-2); --fg:var(--ink); --fg-2:#58657A;
  --fg-3:#8794A6; --edge:var(--line); --accent:var(--signal); --accent-soft:var(--signal-soft);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080D15; --surface:#111A26; --fg:#E4EAF3; --fg-2:#94A2B6; --fg-3:#63718A;
  --edge:#233042; --accent:#7C8FFF; --accent-soft:#1A2340;
  --pass:#3FBF84; --hold:#DDA43A; --fail:#E4675C;
}}
:root[data-theme="dark"]{
  --bg:#080D15; --surface:#111A26; --fg:#E4EAF3; --fg-2:#94A2B6; --fg-3:#63718A;
  --edge:#233042; --accent:#7C8FFF; --accent-soft:#1A2340;
  --pass:#3FBF84; --hold:#DDA43A; --fail:#E4675C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;
     line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:640;letter-spacing:-.02em}
.controls{display:flex;gap:8px}
button{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--edge);
       border-radius:var(--r);padding:7px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.warn{display:flex;gap:9px;align-items:baseline;background:var(--surface);border:1px solid var(--edge);
      border-left:3px solid var(--hold);border-radius:var(--r);padding:8px 13px;
      font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.warn b{color:var(--hold);text-transform:uppercase;font-size:9.5px;letter-spacing:.07em}
.warn.bad{border-left-color:var(--fail)} .warn.bad b{color:var(--fail)}

/* ---------- stage ---------- */
.stage{position:relative;height:430px;background:var(--surface);border:1px solid var(--edge);
       border-radius:var(--r);overflow:hidden}
.bigbox{position:absolute;top:96px;width:210px;height:150px;border:2px solid var(--edge);
        border-radius:var(--r);background:var(--bg);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:4px;transition:border-color .35s,box-shadow .35s}
.bigbox.hot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.bigbox.good{border-color:var(--pass);box-shadow:0 0 0 5px transparent}
.bigbox.bad{border-color:var(--fail)}
#fpga{left:190px} #spark{right:120px}
.bigbox .t{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em}
.bigbox .u{font-family:var(--mono);font-size:9.5px;color:var(--fg-3);letter-spacing:.07em;text-transform:uppercase}

/* travelling objects */
.tok{position:absolute;padding:7px 11px;border-radius:var(--r);font-family:var(--mono);font-size:11px;
     white-space:nowrap;border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);
     opacity:0;transform:translate(-50%,-50%);
     transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),
                opacity .35s,transform .45s,background .4s,border-color .4s,color .4s}
.tok.enc{border-color:var(--fg-3);background:var(--surface);color:var(--fg-2)}
.tok.fp{border-color:var(--pass);background:transparent;color:var(--pass)}
.tok.model{border-color:var(--hold);color:var(--hold);background:transparent}
.tok.show{opacity:1}
.tok.pop{transform:translate(-50%,-50%) scale(1.16)}
@media (prefers-reduced-motion:reduce){.tok{transition:opacity .2s}}

.verdictbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
            font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;
            opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;text-align:center}
.verdictbox.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.verdictbox .sub{font-size:11px;font-weight:400;letter-spacing:.04em;margin-top:6px;color:var(--fg-2)}
.ok{color:var(--pass)} .bad{color:var(--fail)}

.caption{min-height:46px;font-size:16px;color:var(--fg);text-wrap:balance}
.caption .m{font-family:var(--mono);font-size:12px;color:var(--fg-3);display:block;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);display:inline-block;margin-right:6px}
.dot.on{background:var(--pass)} .dot.off{background:var(--fail)}
.status{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>Is the datacenter running the correct model?</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>
    </div>
    <div class="controls">
      <button id="tamper">Tamper</button>
      <button id="run" class="primary">Run</button>
    </div>
  </div>

  <div class="warn" id="warnbar">
    <b>Spot check</b><span id="modetext">one (token, layer) of ~460 &mdash; demonstrates the protocol, does not prove the forward pass</span>
  </div>

  <div class="stage" id="stage">
    <div class="bigbox" id="fpga"><div class="t">CERTIFIER</div><div class="u">FPGA on the wire</div></div>
    <div class="bigbox" id="spark"><div class="t">DATACENTER</div><div class="u">runs the model</div></div>
    <div class="verdictbox" id="verdict"></div>
  </div>

  <div class="caption" id="caption">Press Run.</div>
</div>

<script src="/static/socket.io.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const stage = $("stage");

// Geometry is read from the live layout rather than hard-coded, so the boxes and
// the things flying between them cannot drift apart when the window resizes.
function anchors(){
  const s = stage.getBoundingClientRect();
  const f = $("fpga").getBoundingClientRect();
  const k = $("spark").getBoundingClientRect();
  return {
    inX: 60, midY: f.top - s.top + f.height/2,
    fpgaX: f.left - s.left + f.width/2,
    sparkX: k.left - s.left + k.width/2,
    fpBelowY: f.top - s.top + f.height + 52,
    fp2Y: f.top - s.top + f.height + 96,
    modelY: k.top - s.top + k.height + 52
  };
}

let tokens = [];
function mk(cls, text, x, y){
  const d = document.createElement("div");
  d.className = "tok " + cls; d.textContent = text;
  d.style.left = x + "px"; d.style.top = y + "px";
  stage.appendChild(d); tokens.push(d);
  requestAnimationFrame(() => d.classList.add("show"));
  return d;
}
function move(el, x, y){ el.style.left = x + "px"; el.style.top = y + "px"; }
function pop(el){ el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 450); }
function clearStage(){
  tokens.forEach(t => t.remove()); tokens = [];
  $("verdict").classList.remove("show"); $("verdict").innerHTML = "";
  ["fpga","spark"].forEach(i => $(i).className = "bigbox");
}
function say(text, mono){
  $("caption").innerHTML = text + (mono ? '<span class="m">' + mono + "</span>" : "");
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const short = h => h ? (h.slice(0,12) + "…") : "…";

// ---- the sequence. Every value shown comes from the wire; only the pacing is ours.
let modelFp = null, reqFp = null, rspFp = null, tampered = false;

async function seqRequest(d){
  const A = anchors();
  const req = mk("", "PROMPT", A.inX, A.midY);
  say("A request arrives.");
  await wait(700);

  req.textContent = "◼◼◼◼ ENCRYPTED"; req.classList.add("enc"); pop(req);
  say("It is encrypted before it reaches the cable.",
      d.n_tokens + " tokens → " + ((d.ct_in||"").length/2) + " B ciphertext");
  await wait(900);

  move(req, A.fpgaX, A.midY);
  $("fpga").classList.add("hot");
  await wait(950);

  reqFp = mk("fp", "REQUEST FINGERPRINT " + short(d.hreq_disp), A.fpgaX, A.midY);
  await wait(60); move(reqFp, A.fpgaX, A.fpBelowY); pop(reqFp);
  say("The certifier fingerprints it on the way past.",
      "byte-audit " + (d.request_audit ? "PASS" : "FAIL"));
  await wait(800);

  move(req, A.sparkX, A.midY);
  $("fpga").classList.remove("hot"); $("spark").classList.add("hot");
  await wait(950);
  req.remove(); tokens = tokens.filter(t => t !== req);
}

async function seqResponse(d, answer){
  const A = anchors();
  say("The datacenter runs the model and seals the answer.");
  await wait(700);

  const rsp = mk("enc", "◼◼◼◼ ENCRYPTED", A.sparkX, A.midY);
  await wait(600);
  move(rsp, A.fpgaX, A.midY);
  $("spark").classList.remove("hot"); $("fpga").classList.add("hot");
  await wait(950);

  rspFp = mk("fp", "OUTPUT FINGERPRINT " + short(d.hrsp_disp), A.fpgaX, A.midY);
  await wait(60); move(rspFp, A.fpgaX, A.fp2Y); pop(rspFp);
  say("The output is fingerprinted too.",
      "byte-audit " + (d.response_audit ? "PASS" : "FAIL"));
  await wait(800);

  move(rsp, A.inX, A.midY);
  $("fpga").classList.remove("hot");
  await wait(950);
  rsp.textContent = answer; rsp.className = "tok show"; pop(rsp);
  say("Only the user can open it.", answer);
  await wait(900);
}

async function seqProve(){
  const A = anchors();
  mk("model", "MODEL FINGERPRINT " + short(modelFp), A.sparkX, A.modelY);
  say("The datacenter now proves those fingerprints came from the approved model.",
      "zero-knowledge — the weights, the prompt and the answer all stay private");
  $("spark").classList.add("hot");
  await wait(1100);
}

async function seqVerdict(d){
  const A = anchors();
  const r = d.result || {}, ok = r.verdict === "PASS";
  // The three fingerprints converge into the datacenter box and combine there.
  tokens.filter(t => t.classList.contains("fp") || t.classList.contains("model"))
        .forEach(t => { move(t, A.sparkX, A.midY); t.style.transform = "translate(-50%,-50%) scale(.55)"; });
  await wait(950);
  tokens.forEach(t => t.classList.remove("show"));
  await wait(350);

  $("spark").className = "bigbox " + (ok ? "good" : "bad");
  const v = $("verdict");
  v.innerHTML = '<div class="' + (ok ? "ok" : "bad") + '">' +
    (ok ? "VERIFIED" : "REJECTED") + "</div>" +
    '<div class="sub">unexplained information ' + (r.U || "?") +
    " bits · key binding " + (r.keybind || "?") + "</div>";
  v.classList.add("show");
  say(ok ? "The fingerprints match the model. Verified."
         : "The fingerprints do not match. No valid proof exists.",
      ok ? "" : "the datacenter claimed an output the certifier never fingerprinted");
  $("run").disabled = false; $("tamper").disabled = false;
}

// ---- wire
const sock = io("/demo", {transports:["websocket"]});
let pending = null;

sock.on("connect", () => { $("dot").className = "dot on"; });
sock.on("disconnect", () => { $("dot").className = "dot off"; $("conn").textContent = "orchestrator offline"; });
sock.on("hello", d => {
  if (d.mode) $("modetext").textContent = d.mode;
  if (d.model_fp) modelFp = d.model_fp;
  $("conn").textContent = d.agent ? ("wire connected · " + (d.model || "")) : "waiting for the Pi";
  $("run").disabled = !d.agent; $("tamper").disabled = !d.agent;
});
sock.on("wire:agent", d => { $("run").disabled = !d.up; $("tamper").disabled = !d.up;
  $("conn").textContent = d.up ? "wire connected" : "waiting for the Pi"; });

sock.on("beat:armed", () => { tampered = true;
  $("warnbar").className = "warn bad";
  $("warnbar").innerHTML = '<b>Tampered</b><span>this run proves an output the certifier never ' +
    'fingerprinted — the key binding is full strength in every mode, so it fails every time</span>'; });

sock.on("beat:reset", () => { clearStage(); tampered = false;
  $("warnbar").className = "warn";
  $("warnbar").innerHTML = '<b>Spot check</b><span id="modetext">one (token, layer) of ~460 — ' +
    'demonstrates the protocol, does not prove the forward pass</span>';
  say("Press Run."); });

sock.on("beat:start", () => { chain = Promise.resolve(); clearStage(); $("run").disabled = true; $("tamper").disabled = true;
  say("A request arrives."); });

sock.on("beat:tokenized", d => { pending = d; });

sock.on("beat:certified", d => {
  // Both certificates are already in hand; the round trip finished before this
  // event. The staging below is the narrative's, the values are the wire's.
  const m = Object.assign({}, pending || {}, d);
  m.hreq_disp = d.request_digest || "";
  m.hrsp_disp = d.response_digest || "";
  pending = m;
});

let chain = Promise.resolve();
function queue(fn){ chain = chain.then(fn).catch(e => console.error(e)); return chain; }

sock.on("beat:answer", d => queue(async () => {
  const m = pending || {};
  await seqRequest(m);
  await seqResponse(m, d.ok ? d.text : "could not decrypt");
  await seqProve();
}));

// Queued behind the animation: seqVerdict needs the fingerprint boxes to exist
// so it has something to converge, and a fast proof would otherwise arrive first.
sock.on("beat:verdict", d => { if (d.model_fp) modelFp = d.model_fp;
  queue(() => seqVerdict(d)); });
sock.on("beat:error", d => { say("Error.", d.error || ""); $("run").disabled = false; $("tamper").disabled = false; });

$("run").onclick = () => { sock.emit("demo:reset"); setTimeout(() => sock.emit("demo:run", {}), 250); };
$("tamper").onclick = () => { sock.emit("demo:reset"); setTimeout(() => sock.emit("demo:tamper", {}), 250); };
</script>
</body>
</html>
