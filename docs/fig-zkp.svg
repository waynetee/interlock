<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ae" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="as" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="200" fill="white"/>

  <rect x="20" y="60" width="160" height="60" rx="6" fill="#f4eefb" stroke="#7a4aa8"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d1d5c">Verifier</text>

  <rect x="250" y="60" width="160" height="60" rx="6" fill="#eef4fb" stroke="#4a78a8"/>
  <text x="330" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3d5c">Prover frontend</text>

  <rect x="480" y="60" width="160" height="60" rx="6" fill="#fdf3e7" stroke="#b07c3a"/>
  <text x="560" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c3d1d">Interlock</text>

  <rect x="710" y="60" width="160" height="60" rx="6" fill="#eefbef" stroke="#3a8a4a"/>
  <text x="790" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d5c2a">Prover compute</text>
  <text x="790" y="106" text-anchor="middle" font-size="10" fill="#1d5c2a">generates proof &#960;</text>

  <line x1="180" y1="90" x2="250" y2="90" stroke="#333" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="215" y="78" text-anchor="middle" font-size="10" fill="#333">challenge,</text>
  <text x="215" y="110" text-anchor="middle" font-size="10" fill="#333">&#960; + certs</text>

  <line x1="410" y1="90" x2="480" y2="90" stroke="#333" marker-start="url(#as)" marker-end="url(#ae)"/>
  <line x1="640" y1="90" x2="710" y2="90" stroke="#333" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="560" y="142" text-anchor="middle" font-size="10" fill="#333">encrypted traffic, hash-committed by interlock</text>
</svg>
